<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="160mm" height="90mm" viewBox="0 0 160 90">
  <title>Démo laser xTool : image, gravure, marquage, découpe</title>
  <!-- Image importée : gravée en tramage (onglet Images) -->
  <image x="10" y="15" width="55" height="55" xlink:href="data:image/png;base64,"/>
  <!-- Texte noir rempli : couche 3 en Gravure (remplissage) -->
  <text x="74" y="42" font-family="sans-serif" font-weight="bold" font-size="17" fill="#000000">Fab Lab</text>
  <!-- Marquage bleu : couche 1 -->
  <path d="M 74 52 H 150" fill="none" stroke="#0000ff" stroke-width="0.3"/>
  <path d="M 112 58 l 4 8.5 9.3 1.3 -6.8 6.5 1.7 9.2 -8.2 -4.4 -8.2 4.4 1.7 -9.2 -6.8 -6.5 9.3 -1.3 z" fill="none" stroke="#0000ff" stroke-width="0.3"/>
  <!-- Découpe rouge : couche 2 (en dernier) -->
  <rect x="4" y="4" width="152" height="82" rx="6" fill="none" stroke="#ff0000" stroke-width="0.3"/>
</svg>